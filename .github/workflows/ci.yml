name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-only-test-secret-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest --cov=api --cov-report=term-missing

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: printf 'JWT_SECRET=ci-only-test-secret-not-used-anywhere-else\nPOSTGRES_PASSWORD=ci-password\n' > .env
      - run: docker compose build